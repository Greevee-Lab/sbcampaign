# SPDX-License-Identifier: AGPL-3.0-only
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build, test, handshake
    # Building on 24.04 keeps the glibc requirement low enough for newer
    # server releases as well.
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sbcampaign
          POSTGRES_DB: loc_campaign
          # Throwaway CI container, reachable only from this job.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sbcampaign"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libsystemd-dev pkg-config postgresql-client

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release, default features)
        run: cargo build --release --locked

      - name: Test
        run: cargo test --release --locked

      - name: Build without systemd
        run: cargo build --no-default-features --locked

      - name: Set up database (reconstructed schema + synthetic seed)
        env:
          PGHOST: 127.0.0.1
          PGUSER: sbcampaign
          PGDATABASE: loc_campaign
        run: |
          for f in sql/fork/base_schema.sql sql/set_award_rank.sql sql/give_turn_award.sql \
                   sql/give_round_award.sql sql/shop_drop.sql sql/fork/test_seed.sql; do
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Handshake test against the release binary
        run: |
          sed -e 's/^bind_port = .*/bind_port = 23457\nbind_ip = "127.0.0.1"/' \
              -e 's/^database = .*/&\nhost = "127.0.0.1"\nport = 5432/' \
              loc.toml > ci.toml
          ./target/release/sbcampaign ci.toml > server.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            python3 -c "import socket; socket.create_connection(('127.0.0.1', 23457), 1).close()" 2>/dev/null && break
            sleep 1
          done
          python3 tools/handshake_client.py --period
          python3 tools/handshake_client.py --xuid 0x0009FFFF00000002 --period
          kill "$SERVER_PID"

      - name: Deploy scripts (syntax) and migrations (twice, idempotent)
        env:
          PGHOST: 127.0.0.1
          PGUSER: sbcampaign
          PGDATABASE: loc_campaign
        run: |
          for f in deploy/deploy.sh deploy/server/*.sh; do bash -n "$f"; done
          createdb migrate_ci
          bash deploy/server/migrate.sh migrate_ci sql/fork/test_seed.sql
          bash deploy/server/migrate.sh migrate_ci sql/fork/test_seed.sql | tee second.log
          grep -q "migrate_ci: 0 applied" second.log
          createdb migrate_ci_prod
          bash deploy/server/migrate.sh migrate_ci_prod sql/fork/preseason.sql
          test "$(psql -At -d migrate_ci_prod -c 'SELECT count(*) FROM settings')" = 1

      - name: Database tests (identity, core boundary) and identity backfill
        env:
          PGHOST: 127.0.0.1
          PGUSER: sbcampaign
          PGDATABASE: loc_campaign
          SBCAMPAIGN_TEST_DATABASE_URL: postgres://sbcampaign@127.0.0.1:5432/migrate_ci
          SBCAMPAIGN_REQUIRE_DB_TESTS: "1"
        run: |
          cargo test --release --locked campaign_core 2>&1 | tee dbtest.log
          grep -q "db_steelbound_player_through_the_core ... ok" dbtest.log
          grep -q "db_core_api_display_names ... ok" dbtest.log
          grep -q "db_core_api_idempotency_and_audit ... ok" dbtest.log
          createdb backfill_ci
          bash tools/test_identity_backfill.sh backfill_ci

      - name: Core API (mutual TLS) against the release binary
        env:
          PGHOST: 127.0.0.1
          PGUSER: sbcampaign
        run: |
          ca=$RUNNER_TEMP/ca; other=$RUNNER_TEMP/other-ca
          bash tools/steelcore-ca.sh init "$ca"
          bash tools/steelcore-ca.sh server "$ca" core-api-server
          bash tools/steelcore-ca.sh client "$ca" steelnet-ci
          bash tools/steelcore-ca.sh client "$ca" stats-ci
          bash tools/steelcore-ca.sh client "$ca" unregistered-ci
          bash tools/steelcore-ca.sh init "$other"
          bash tools/steelcore-ca.sh client "$other" steelnet-ci
          sed -e 's/^bind_port = .*/bind_port = 23459\nbind_ip = "127.0.0.1"/' \
              -e 's/^database = .*/database = "migrate_ci"\nhost = "127.0.0.1"\nport = 5432/' \
              loc.toml > core.toml
          cat >> core.toml <<EOF
          [core_api]
          bind = "127.0.0.1:47101"
          cert = "$ca/core-api-server.crt"
          key = "$ca/core-api-server.key"
          client_ca = "$ca/ca.crt"
          [[core_api.access]]
          name = "steelnet-ci"
          provider = "steelbound"
          cert_sha256 = "$(bash tools/steelcore-ca.sh fingerprint "$ca/steelnet-ci.crt")"
          scopes = ["identity:write", "profile:write", "read:public"]
          [[core_api.access]]
          name = "stats-ci"
          cert_sha256 = "$(bash tools/steelcore-ca.sh fingerprint "$ca/stats-ci.crt")"
          scopes = ["read:public"]
          EOF
          ./target/release/sbcampaign core.toml > core.log 2>&1 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            python3 -c "import socket; socket.create_connection(('127.0.0.1', 47101), 1).close()" 2>/dev/null && break
            sleep 1
          done
          c() { python3 tools/core_api_client.py --port 47101 --ca "$ca/ca.crt" "$@"; }
          sn=(--cert "$ca/steelnet-ci.crt" --key "$ca/steelnet-ci.key")
          c "${sn[@]}" steelcore.v1.IdentityService/ResolveIdentity '{"externalId": "4242"}'
          c "${sn[@]}" steelcore.v1.PlayerService/SetDisplayName             '{"playerId": "00000000-0000-0000-5342-4c0100001092", "name": "Ci Pilot", "idempotencyKey": "ci-key-0001"}'
          c "${sn[@]}" steelcore.v1.PlayerService/CheckDisplayName '{"name": "Ci P1lot"}' | grep -q SIMILAR
          c --cert "$ca/stats-ci.crt" --key "$ca/stats-ci.key" --expect permission_denied             steelcore.v1.IdentityService/ResolveIdentity '{"externalId": "4243"}'
          c --cert "$ca/unregistered-ci.crt" --key "$ca/unregistered-ci.key" --expect unauthenticated             steelcore.v1.PlayerService/GetPlayer '{"playerId": "00000000-0000-0000-5342-4c0100001092"}'
          c --cert "$other/steelnet-ci.crt" --key "$other/steelnet-ci.key" --expect tls             steelcore.v1.PlayerService/GetPlayer '{"playerId": "00000000-0000-0000-5342-4c0100001092"}'
          c --expect tls steelcore.v1.PlayerService/GetPlayer '{"playerId": "00000000-0000-0000-5342-4c0100001092"}'
          test "$(psql -At -d migrate_ci -c "SELECT count(*) FROM audit_log WHERE access_id = 'steelnet-ci'")" = 2
          test "$(psql -At -d migrate_ci -c "SELECT count(*) FROM audit_log WHERE access_id = 'stats-ci' AND outcome = 'permission_denied'")" = 1
          kill "$SERVER_PID"
          cat core.log

      - name: Server log
        if: always()
        run: cat server.log || true

      - name: Package
        run: |
          mkdir -p dist/sbcampaign
          cp target/release/sbcampaign loc.toml dist/sbcampaign/
          cp -r sql dist/sbcampaign/sql
          cp -r deploy dist/sbcampaign/deploy
          mkdir -p dist/sbcampaign/tools
          cp tools/handshake_client.py tools/core_api_client.py tools/steelcore-ca.sh dist/sbcampaign/tools/
          echo "${GITHUB_SHA}" > dist/sbcampaign/COMMIT

      - uses: actions/upload-artifact@v4
        with:
          name: sbcampaign-x86_64-${{ github.sha }}
          path: dist/sbcampaign
          if-no-files-found: error

  no-systemd:
    name: Build and test without systemd (Windows)
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --no-default-features --locked
      - run: cargo test --no-default-features --locked
