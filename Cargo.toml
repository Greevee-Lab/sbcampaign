[package]
name = "sbcampaign"
version = "0.1.0"
authors = ["QuantX"]
edition = "2024"

[features]
# Log to the systemd journal and notify systemd on start/stop.
# Build with `--no-default-features` to log to stderr instead
# (e.g. for local testing on machines without systemd).
default = ["journal"]
journal = ["dep:systemd"]

[dependencies]
bytes = "1.12.1"
chrono = "0.4.45"
ed25519-dalek = "2"
futures = "0.3.34"
num_enum = "0.7.6"
sqlx = {version="0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono"]}
systemd = {version="0.11.1", features = ["journal"], optional = true}
thiserror = "2.0.21"
tokio = {version="1.54.1", features = ["full"]}
tokio-stream = "0.1.19"
tokio-util = {version="0.7.20", features = ["codec", "rt"]}
toml = "1.2.1"
uuid = "1.29.0"

# Core API (steelcore.v1): gRPC and Connect-JSON over mutual TLS.
axum = { version = "0.8", default-features = false, features = ["http1", "http2", "json", "tokio"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
pbjson = "0.9"
prost = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tonic = { version = "0.14", default-features = false, features = ["codegen", "router", "transport"] }
tonic-prost = "0.14"
tower = { version = "0.5", features = ["util"] }

[build-dependencies]
pbjson-build = "0.9"
prost = "0.14"
prost-types = "0.14"
protox = "0.10"
tonic-prost-build = "0.14"

[dev-dependencies]
prost-types = "0.14"
rcgen = "0.14"
